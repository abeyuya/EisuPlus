name: EisuMod
options:
  bundleIdPrefix: com.github.abeyuya
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EisuMod:
    type: application
    platform: macOS
    sources:
      - EisuMod
    info:
      path: EisuMod/Info.plist
      properties:
        CFBundleDisplayName: EisuMod
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.abeyuya.EisuMod
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 37XL3EDJ44
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
