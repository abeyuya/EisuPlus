name: EisuMod
options:
  bundleIdPrefix: com.github.abeyuya
  # Swift パッケージのバージョンはルートの Package.resolved で固定し、生成のたびに xcodeproj へ置く
  # (Xcode Cloud はパッケージを自動解決しないので必須。手元のビルドも同じバージョンにそろえる)
  postGenCommand: mkdir -p EisuMod.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp Package.resolved EisuMod.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 正式リリースのバージョンは、release/production に push されたときに最新の vX.Y.Z の次のパッチになる。
    # マイナー・メジャーを上げるときはここを上げる (scripts/next-release-version.sh)
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 37XL3EDJ44
    PRODUCT_NAME: EisuPlus
    PRODUCT_BUNDLE_IDENTIFIER: com.github.abeyuya.EisuMod
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
packages:
  # 上げるときは、生成した xcodeproj の project.xcworkspace/xcshareddata/swiftpm/Package.resolved を消してから
  # `xcodebuild -resolvePackageDependencies` し、できた Package.resolved をルートにコピーする。
  # Sparkle なら .github/workflows/pages.yml の SPARKLE_VERSION と SPARKLE_SHA256 も合わせる
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  # Developer ID 署名・サンドボックスなし・Sparkle で自動アップデート。隣のデスクトップへ運ぶ機能など非公開 API を使う機能を含む
  EisuMod:
    type: application
    platform: macOS
    sources:
      - EisuMod
    info:
      path: EisuMod/Info.plist
      properties:
        CFBundleDisplayName: EisuPlus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Yuya Abe
        # Sparkle による自動アップデート。appcast.xml は GitHub Pages に置く（docs/RELEASE.md）
        SUFeedURL: https://abeyuya.github.io/EisuPlus/appcast.xml
        SUPublicEDKey: j2d/9tqvxqK80oVnmgBMRAN555duYgxg1ZD0Nn8Ew4M=
        SUEnableAutomaticChecks: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        # Xcode Cloud のクラウド署名は自動署名が前提。ローカルの scripts/install.sh では Developer ID に上書きする
        CODE_SIGN_STYLE: Automatic
        # 公証 (notarization) に必須
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

schemes:
  # Xcode Cloud は共有スキームが必要
  EisuMod:
    build:
      targets:
        EisuMod: all
    archive:
      config: Release
