name: EisuMod
options:
  bundleIdPrefix: com.github.abeyuya
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EisuMod:
    type: application
    platform: macOS
    sources:
      - EisuMod
    info:
      path: EisuMod/Info.plist
      properties:
        CFBundleDisplayName: EisuMod
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.abeyuya.EisuMod
        # Xcode Cloud のクラウド署名は自動署名が前提。ローカルの scripts/install.sh では Developer ID に上書きする
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37XL3EDJ44
        # 公証 (notarization) に必須
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  # Xcode Cloud は共有スキームが必要
  EisuMod:
    build:
      targets:
        EisuMod: all
    archive:
      config: Release
