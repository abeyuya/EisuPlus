name: EisuMod
options:
  bundleIdPrefix: com.github.abeyuya
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 37XL3EDJ44
    PRODUCT_NAME: EisuMod
    PRODUCT_BUNDLE_IDENTIFIER: com.github.abeyuya.EisuMod
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
targets:
  # 自分用（Developer ID 署名・サンドボックスなし）。隣のデスクトップへ運ぶ機能など非公開 API を使う機能を含む
  EisuMod:
    type: application
    platform: macOS
    sources:
      - EisuMod
    info:
      path: EisuMod/Info.plist
      properties:
        CFBundleDisplayName: EisuMod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Yuya Abe
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO

  # Mac App Store 用。サンドボックスを有効にし、非公開 API を使う機能を APP_STORE フラグで外す
  EisuMod-AppStore:
    type: application
    platform: macOS
    sources:
      - EisuMod
    settings:
      base:
        INFOPLIST_FILE: EisuMod/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/EisuMod-AppStore.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SELECTED_FILES: readonly
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
