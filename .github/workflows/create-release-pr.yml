name: Create a release pull request

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"

      - name: Install gems
        run: gem install --no-document git-pr-release:2.5.0

      - name: Run git-pr-release
        env:
          GIT_PR_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: release/production
          GIT_PR_RELEASE_BRANCH_STAGING: main
        run: git-pr-release --squashed
